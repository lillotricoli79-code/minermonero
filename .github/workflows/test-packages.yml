name: Validate XMRig Control Center packages

on:
  workflow_dispatch:
  push:
    branches:
      - aiqween-integration
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: aiqween-integration
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile base controller and shell helper syntax
        run: |
          python -m py_compile packages/base/XMRig-Control-Center/app.py
          python -m py_compile packages/aiqween/XMRig-Control-Center-AIQween-module/ai_qween/*.py
      - name: Compile AI Qween module
        run: python -m compileall -q packages/aiqween/XMRig-Control-Center-AIQween-module/ai_qween
      - name: Run AI Qween regression tests
        working-directory: packages/aiqween/XMRig-Control-Center-AIQween-module
        run: python -m unittest discover -s tests -v

  windows-powershell-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: aiqween-integration
      - name: Parse all PowerShell scripts without executing them
        shell: pwsh
        run: |
          $files = Get-ChildItem packages/base/XMRig-Control-Center -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($file.Name)"
              $errors | Format-List
              exit 1
            }
            Write-Host "PowerShell syntax OK: $($file.Name)"
          }
          if (-not (Test-Path "packages/base/XMRig-Control-Center/xmrig-shell.ps1")) {
            throw "xmrig-shell.ps1 missing"
          }
          Write-Host "Shell control script present"
          $out = Join-Path $env:RUNNER_TEMP "xmrig-package-test"
          & "packages/base/XMRig-Control-Center/build_release.ps1" -OutputDirectory $out
          if (-not (Get-ChildItem $out -Filter "*.zip")) { throw "Source bundle ZIP was not created." }
          Write-Host "Source bundle generation OK"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "packages/base/XMRig-Control-Center/download_xmrig.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
          Write-Host "PowerShell syntax OK"
