name: Application CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# Validate the newest source revision promptly. A stuck older run (for
# example while vcpkg installs dependencies) must not block the current build.
concurrency:
  group: native-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux backend tests and dashboard build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest backend.tests.test_main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard


  windows:
    name: Windows x64 native miner, backend and dashboard
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MSYS2 MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Build miner, run native tests, backend tests and dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\windows\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build script failed." }

      - name: Stage portable Windows x64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "engine\build-mingw-ninja"
          $exe = Join-Path $build "unique-rx.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "unique-rx.exe not found after successful build." }
          $out = Join-Path $env:GITHUB_WORKSPACE "release\unique-rx-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $exe -Destination $out
          Get-ChildItem -LiteralPath $build -Filter "*.dll" -File | Copy-Item -Destination $out -Force
          $hash = (Get-FileHash -LiteralPath (Join-Path $out "unique-rx.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashLines = @("$hash  unique-rx.exe")
          $msr = Join-Path $build "msr\IntelMSR.bin"
          if (Test-Path -LiteralPath $msr) {
            $moduleHash = (Get-FileHash -LiteralPath $msr -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($moduleHash -ne "d6ed85d65ab17a22f813ef98207d6d537155ee2ded5976a21cb48413c9b92e5f") { throw "Packaged IntelMSR.bin SHA-256 mismatch." }
            New-Item -ItemType Directory -Force -Path (Join-Path $out "msr") | Out-Null
            Copy-Item -LiteralPath $msr -Destination (Join-Path $out "msr\IntelMSR.bin")
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "engine\msr\PawnIO-COPYING") -Destination (Join-Path $out "msr\COPYING")
            $hashLines += "$moduleHash  msr/IntelMSR.bin"
          } else {
            Write-Host "Optional MSR module not present; standard CPU package remains valid."
          }
          Set-Content -LiteralPath (Join-Path $out "SHA256SUMS.txt") -Encoding ascii -Value $hashLines
          $licenses = Join-Path $out "licenses"
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSES\XMRIG-GPL-3.0.txt") -Destination $licenses
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSES\RXMINER-MIT.txt") -Destination $licenses
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSES\NYXRX-MIT.txt") -Destination $licenses
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSES\XMR-MINER-GPL-3.0.txt") -Destination $licenses
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "engine\src\randomx\upstream\LICENSE") -Destination (Join-Path $licenses "RANDOMX-BSD-3-CLAUSE.txt")
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "README.md") -Destination $out
          $sourceZip = Join-Path $out "unique-rx-source.zip"
          git archive --format=zip "--output=$sourceZip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to package the exact corresponding source revision." }
          $sourceHash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath (Join-Path $out "SHA256SUMS.txt") -Encoding ascii -Value "$sourceHash  unique-rx-source.zip"
          git rev-parse HEAD | Set-Content -LiteralPath (Join-Path $out "SOURCE-COMMIT.txt") -Encoding ascii
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "config.example.json") -Destination (Join-Path $out "config.example.json")
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "requirements.txt") -Destination $out
          $backendOut = Join-Path $out "backend"
          New-Item -ItemType Directory -Force -Path $backendOut | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "backend\*") -Destination $backendOut -Recurse -Force
          $dashboardOut = Join-Path $out "dashboard\dist"
          New-Item -ItemType Directory -Force -Path $dashboardOut | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "dashboard\dist\*") -Destination $dashboardOut -Recurse -Force
          $launcherDir = Join-Path $out "scripts\windows"
          New-Item -ItemType Directory -Force -Path $launcherDir | Out-Null
          foreach ($script in @("start.bat","start.ps1","stop.bat","stop.ps1","diagnose.bat","diagnose.ps1")) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\$script") -Destination $launcherDir
          }
          Set-Content -LiteralPath (Join-Path $out "start.bat") -Encoding ascii -Value @(
            "@echo off",
            "setlocal",
            'call "%~dp0scripts\windows\start.bat" %*',
            "exit /b %errorlevel%"
          )
          Set-Content -LiteralPath (Join-Path $out "stop.bat") -Encoding ascii -Value @(
            "@echo off",
            "setlocal",
            'call "%~dp0scripts\windows\stop.bat" %*',
            "exit /b %errorlevel%"
          )
          Set-Content -LiteralPath (Join-Path $out "diagnose.bat") -Encoding ascii -Value @(
            "@echo off",
            "setlocal",
            'call "%~dp0scripts\windows\diagnose.bat" %*',
            "exit /b %errorlevel%"
          )
          "Portable miner, matching source, licenses and optional MSR launcher staged: $out"

      - name: Upload verified Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: unique-rx-windows-x64
          path: release/unique-rx-windows-x64/
          if-no-files-found: error
          retention-days: 30
