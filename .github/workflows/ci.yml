name: Application CI

on:
  workflow_dispatch:

permissions:
  contents: read

# Validate the newest source revision promptly. A stuck older run (for
# example while vcpkg installs dependencies) must not block the current build.
concurrency:
  group: native-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux backend tests and dashboard build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest backend.tests.test_main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard


  windows:
    name: Windows x64 native miner, backend and dashboard
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MSYS2 MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Download and verify official PawnIO Intel MSR module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "pawnio-0.2.11.zip"
          $extract = Join-Path $env:RUNNER_TEMP "pawnio-0.2.11"
          Invoke-WebRequest -Uri "https://github.com/namazso/PawnIO.Modules/releases/download/0.2.11/release_0_2_11.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $module = Get-ChildItem -LiteralPath $extract -Filter "IntelMSR.bin" -File -Recurse | Select-Object -First 1
          if (-not $module) { throw "IntelMSR.bin not found in official PawnIO 0.2.11 release." }
          $actual = (Get-FileHash -LiteralPath $module.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "d6ed85d65ab17a22f813ef98207d6d537155ee2ded5976a21cb48413c9b92e5f"
          if ($actual -ne $expected) { throw "IntelMSR.bin SHA-256 mismatch: $actual" }
          $destination = Join-Path $env:GITHUB_WORKSPACE "engine\msr\IntelMSR.bin"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
          Copy-Item -LiteralPath $module.FullName -Destination $destination -Force
          "Official PawnIO IntelMSR 0.2.11 verified: $actual"

      - name: Build miner, run native tests, backend tests and dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\windows\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build script failed." }

      - name: Stage portable Windows x64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "engine\build-mingw-ninja"
          $exe = Join-Path $build "unique-rx.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "unique-rx.exe not found after successful build." }
          $out = Join-Path $env:GITHUB_WORKSPACE "release\unique-rx-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $exe -Destination $out
          Get-ChildItem -LiteralPath $build -Filter "*.dll" -File | Copy-Item -Destination $out -Force
          $msr = Join-Path $build "msr\IntelMSR.bin"
          if (-not (Test-Path -LiteralPath $msr)) { throw "Verified IntelMSR.bin was not copied beside the native executable." }
          New-Item -ItemType Directory -Force -Path (Join-Path $out "msr") | Out-Null
          Copy-Item -LiteralPath $msr -Destination (Join-Path $out "msr\IntelMSR.bin")
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "engine\msr\PawnIO-COPYING") -Destination (Join-Path $out "msr\COPYING")
          $moduleHash = (Get-FileHash -LiteralPath (Join-Path $out "msr\IntelMSR.bin") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($moduleHash -ne "d6ed85d65ab17a22f813ef98207d6d537155ee2ded5976a21cb48413c9b92e5f") { throw "Packaged IntelMSR.bin SHA-256 mismatch." }
          $hash = (Get-FileHash -LiteralPath (Join-Path $out "unique-rx.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $out "SHA256SUMS.txt") -Encoding ascii -Value @(
            "$hash  unique-rx.exe",
            "$moduleHash  msr/IntelMSR.bin"
          )
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "config.example.json") -Destination (Join-Path $out "config.example.json")
          $launcherDir = Join-Path $out "scripts\windows"
          New-Item -ItemType Directory -Force -Path $launcherDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\start.bat") -Destination $launcherDir
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\start.ps1") -Destination $launcherDir
          Set-Content -LiteralPath (Join-Path $out "start.bat") -Encoding ascii -Value @(
            "@echo off",
            "setlocal",
            'call "%~dp0scripts\windows\start.bat" %*',
            "exit /b %errorlevel%"
          )
          "Portable miner, root start.bat and elevated MSR launcher staged: $out"

      - name: Upload verified Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: unique-rx-windows-x64
          path: release/unique-rx-windows-x64/
          if-no-files-found: error
          retention-days: 30
