name: Native engine CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# Validate the newest source revision promptly. A stuck older run (for
# example while vcpkg installs dependencies) must not block the current build.
concurrency:
  group: native-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest backend.tests.test_main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libssl-dev

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows native build and tests
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest backend.tests.test_main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard

      - name: Cache vcpkg OpenSSL installation
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}\installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}\downloads
          key: vcpkg-${{ runner.os }}-openssl-x64-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-openssl-x64-

      - name: Install OpenSSL
        shell: pwsh
        env:
          # Use the CMake already provisioned on the hosted runner instead of
          # downloading vcpkg's pinned copy from GitHub on every cold cache.
          VCPKG_FORCE_SYSTEM_BINARIES: "1"
        run: vcpkg install openssl:x64-windows

      - name: Configure native engine
        shell: pwsh
        run: >
          cmake -S engine -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build native engine
        run: cmake --build build --config Release --parallel 2

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure
