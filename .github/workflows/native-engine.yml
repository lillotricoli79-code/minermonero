name: Native miner engine validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-miner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux C++ miner build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python and run backend tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest backend.tests.test_main

      - name: Set up Node.js and build dashboard
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard
          test -f dashboard/dist/index.html

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libssl-dev

      - name: Configure native engine
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build native engine
        run: cmake --build build --parallel 2

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure

      - name: Stage complete Linux application with corresponding source and licenses
        run: |
          set -euo pipefail
          out="release/unique-rx-linux-x64"
          mkdir -p "$out/licenses" "$out/dashboard/dist" "$out/scripts/linux" "$out/msr"
          cp build/unique-rx "$out/unique-rx"
          cp README.md config.example.json requirements.txt "$out/"
          cp -R backend "$out/backend"
          cp -R dashboard/dist/. "$out/dashboard/dist/"
          cp scripts/linux/start.sh scripts/linux/stop.sh scripts/linux/diagnose.sh "$out/scripts/linux/"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec "$(dirname "$0")/scripts/linux/start.sh" "$@"\n' > "$out/start.sh"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec "$(dirname "$0")/scripts/linux/stop.sh" "$@"\n' > "$out/stop.sh"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec "$(dirname "$0")/scripts/linux/diagnose.sh" "$@"\n' > "$out/diagnose.sh"
          chmod +x "$out/start.sh" "$out/stop.sh" "$out/diagnose.sh"
          cp LICENSES/XMRIG-GPL-3.0.txt LICENSES/RXMINER-MIT.txt LICENSES/NYXRX-MIT.txt LICENSES/XMR-MINER-GPL-3.0.txt LICENSES/PAWNIO-MODULES-COPYING "$out/licenses/"
          cp engine/src/randomx/upstream/LICENSE "$out/licenses/RANDOMX-BSD-3-CLAUSE.txt"
          cp engine/msr/PawnIO-COPYING "$out/msr/COPYING"
          git archive --format=zip --output="$out/unique-rx-source.zip" HEAD
          git rev-parse HEAD > "$out/SOURCE-COMMIT.txt"
          sha256sum "$out/unique-rx" "$out/unique-rx-source.zip" > "$out/SHA256SUMS.txt"

      - name: Upload complete Linux application and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: unique-rx-linux-x64
          path: release/unique-rx-linux-x64/
          if-no-files-found: error

  windows:
    name: Windows C++ miner build and tests
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate runner OpenSSL
        shell: pwsh
        run: |
          $opensslRoot = Join-Path $env:ProgramFiles "OpenSSL"
          $opensslHeader = Join-Path $opensslRoot "include/openssl/ssl.h"
          if (-not (Test-Path $opensslHeader)) {
            throw "The hosted Windows image does not contain its provisioned OpenSSL headers: $opensslHeader"
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure native engine
        shell: pwsh
        run: >
          cmake -S engine -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

      - name: Build native engine
        run: cmake --build build --config Release --parallel 2

      # The CTest executables link OpenSSL too. Place its runtime DLLs beside
      # the multi-config Release binaries before running CTest, not afterwards.
      - name: Bundle OpenSSL runtime DLLs
        shell: pwsh
        run: |
          $opensslBin = Join-Path $env:OPENSSL_ROOT_DIR "bin"
          $dlls = @(Get-ChildItem -Path $opensslBin -File | Where-Object {
            $_.Name -like "libssl*.dll" -or $_.Name -like "libcrypto*.dll"
          })
          if ($dlls.Count -lt 2) {
            throw "OpenSSL runtime DLLs were not found in $opensslBin"
          }
          Copy-Item -LiteralPath $dlls.FullName -Destination "build/Release" -Force

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows miner with corresponding source and licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "build\Release"
          $licenses = Join-Path $out "licenses"
          $msr = Join-Path $out "msr"
          New-Item -ItemType Directory -Force -Path $licenses, $msr | Out-Null
          Copy-Item -LiteralPath "README.md" -Destination $out
          Copy-Item -LiteralPath "LICENSES\XMRIG-GPL-3.0.txt" -Destination $licenses
          Copy-Item -LiteralPath "LICENSES\RXMINER-MIT.txt" -Destination $licenses
          Copy-Item -LiteralPath "LICENSES\NYXRX-MIT.txt" -Destination $licenses
          Copy-Item -LiteralPath "LICENSES\XMR-MINER-GPL-3.0.txt" -Destination $licenses
          Copy-Item -LiteralPath "engine\src\randomx\upstream\LICENSE" -Destination (Join-Path $licenses "RANDOMX-BSD-3-CLAUSE.txt")
          Copy-Item -LiteralPath "engine\msr\PawnIO-COPYING" -Destination (Join-Path $msr "COPYING")
          git archive --format=zip "--output=$(Join-Path $out 'unique-rx-source.zip')" HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to package corresponding source revision." }
          git rev-parse HEAD | Set-Content -LiteralPath (Join-Path $out "SOURCE-COMMIT.txt") -Encoding ascii
          $checksums = @(
            (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out "unique-rx.exe")).Hash.ToLower() + "  unique-rx.exe"
            (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out "unique-rx-source.zip")).Hash.ToLower() + "  unique-rx-source.zip"
          )
          $checksums | Set-Content -LiteralPath (Join-Path $out "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows miner and corresponding source package
        uses: actions/upload-artifact@v4
        with:
          name: unique-rx-windows-x64
          path: |
            build/Release/unique-rx.exe
            build/Release/libssl*.dll
            build/Release/libcrypto*.dll
            build/Release/README.md
            build/Release/licenses/**
            build/Release/msr/COPYING
            build/Release/unique-rx-source.zip
            build/Release/SOURCE-COMMIT.txt
            build/Release/SHA256SUMS.txt
          if-no-files-found: error
