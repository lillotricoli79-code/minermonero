name: Native miner engine validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-miner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux C++ miner build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libssl-dev

      - name: Configure native engine
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build native engine
        run: cmake --build build --parallel 2

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload Linux miner executable
        uses: actions/upload-artifact@v4
        with:
          name: unique-rx-linux-x64
          path: build/unique-rx
          if-no-files-found: error

  windows:
    name: Windows C++ miner build and tests
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate runner OpenSSL
        shell: pwsh
        run: |
          $opensslRoot = Join-Path $env:ProgramFiles "OpenSSL"
          $opensslHeader = Join-Path $opensslRoot "include/openssl/ssl.h"
          if (-not (Test-Path $opensslHeader)) {
            throw "The hosted Windows image does not contain its provisioned OpenSSL headers: $opensslHeader"
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure native engine
        shell: pwsh
        run: >
          cmake -S engine -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

      - name: Build native engine
        run: cmake --build build --config Release --parallel 2

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bundle OpenSSL runtime DLLs
        shell: pwsh
        run: |
          $opensslBin = Join-Path $env:OPENSSL_ROOT_DIR "bin"
          $dlls = @(Get-ChildItem -Path $opensslBin -File | Where-Object {
            $_.Name -like "libssl*.dll" -or $_.Name -like "libcrypto*.dll"
          })
          if ($dlls.Count -lt 2) {
            throw "OpenSSL runtime DLLs were not found in $opensslBin"
          }
          Copy-Item -LiteralPath $dlls.FullName -Destination "build/Release" -Force

      - name: Upload Windows miner executable and runtime
        uses: actions/upload-artifact@v4
        with:
          name: unique-rx-windows-x64
          path: |
            build/Release/unique-rx.exe
            build/Release/libssl*.dll
            build/Release/libcrypto*.dll
          if-no-files-found: error
