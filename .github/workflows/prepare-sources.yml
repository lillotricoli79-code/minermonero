name: Prepare source trees
on:
  workflow_dispatch:
  push:
    branches:
      - aiqween-integration
    paths:
      - .github/workflows/prepare-sources.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aiqween-integration
          fetch-depth: 0
      - name: Extract both original archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/base packages/aiqween
          unzip -oq XMRig-Control-Center-source.zip -d packages/base
          unzip -oq XMRig-Control-Center-AIQween-source.zip -d packages/aiqween
          find packages -type d -name __pycache__ -prune -exec rm -rf {} +
          find packages -type f -name '*.pyc' -delete
          python - <<'PY'
          from pathlib import Path
          root = Path("packages")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          if not files:
              raise SystemExit("No source files extracted")
          (root / "SOURCE_MANIFEST.txt").write_text(
              "\n".join(f"{p.as_posix()} ({p.stat().st_size} bytes)" for p in files) + "\n",
              encoding="utf-8"
          )
          print(f"Extracted {len(files)} files")
          for p in files:
              print(p)
          PY
      - name: Commit extracted source trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Extract original XMRig Control Center source packages"
            git push origin HEAD:aiqween-integration
          fi
